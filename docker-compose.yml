services:
  postgres_db:
    image: postgres:15-alpine
    container_name: fhir_postgres
    restart: always
    environment:
      POSTGRES_USER: health_admin
      POSTGRES_PASSWORD: SecureHospitalNetwork2026!
      POSTGRES_DB: fhir_triage_records
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_cache:
    image: redis:7-alpine
    container_name: fhir_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
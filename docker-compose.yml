version: '3.8'

services:
  # 1. PostgreSQL Persistent Ledger Layer (Bucket B)
  postgres_db:
    image: postgres:15-alpine
    container_name: fhir_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fhir_network

  # 2. Redis High-Velocity Live Cache (Bucket A)
  redis_cache:
    image: redis:7-alpine
    container_name: fhir_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - fhir_network

  # 3. FastAPI Translation & Triage Core API (The Central Brain)
  backend_api:
    build: ./backend
    container_name: fhir_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - REDIS_HOST=${REDIS_HOST}
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - fhir_network

networks:
  fhir_network:
    driver: bridge

volumes:
  postgres_data: